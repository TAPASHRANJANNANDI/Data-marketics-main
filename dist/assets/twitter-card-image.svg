<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Data Marketics — B2B Data, Demand Generation and Lead Generation Services">
  <defs>
    <!-- Deep teal → bright mint background -->
    <linearGradient id="tc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="45%" stop-color="#0d7377"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <!-- Warm mint glow, top right -->
    <radialGradient id="tc-glow1" cx="82%" cy="18%" r="52%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <!-- Cool teal glow, bottom left -->
    <radialGradient id="tc-glow2" cx="12%" cy="88%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <!-- Subtle dot grid pattern -->
    <pattern id="tc-dots" x="0" y="0" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ccfbf1" fill-opacity="0.10"/>
    </pattern>
    <!-- Wordmark gradient (white → mint) -->
    <linearGradient id="tc-word" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <!-- Accent dot gradient -->
    <linearGradient id="tc-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <!-- Layered background -->
  <rect width="1200" height="630" fill="url(#tc-bg)"/>
  <rect width="1200" height="630" fill="url(#tc-dots)"/>
  <rect width="1200" height="630" fill="url(#tc-glow1)"/>
  <rect width="1200" height="630" fill="url(#tc-glow2)"/>

  <!-- Decorative concentric arcs on the right — data waves / network echo -->
  <g transform="translate(1050, 315)" fill="none" opacity="0.28" stroke="#5eead4">
    <circle r="240" stroke-width="2"/>
    <circle r="185" stroke-width="1.5"/>
    <circle r="130" stroke-width="1.5"/>
    <circle r="75" stroke-width="1"/>
  </g>
  <!-- Bright bullseye at the center of the arcs — the "target" -->
  <g transform="translate(1050, 315)">
    <circle r="16" fill="#5eead4" opacity="0.95"/>
    <circle r="28" fill="none" stroke="#5eead4" stroke-opacity="0.5" stroke-width="2"/>
  </g>
  <!-- Small data-node dots scattered on the arcs -->
  <g fill="#ccfbf1" opacity="0.85">
    <circle cx="810" cy="315" r="4.5"/>
    <circle cx="865" cy="200" r="3.5"/>
    <circle cx="1180" cy="180" r="4"/>
    <circle cx="1215" cy="440" r="3.5"/>
    <circle cx="920" cy="470" r="4"/>
    <circle cx="1145" cy="315" r="3"/>
  </g>

  <!-- Eyebrow chip -->
  <g transform="translate(90, 158)">
    <rect x="0" y="0" width="290" height="34" rx="17" fill="#ecfdf5" fill-opacity="0.14" stroke="#5eead4" stroke-opacity="0.55" stroke-width="1"/>
    <text x="145" y="23" fill="#ccfbf1" font-family="'Figtree','IBM Plex Sans','Segoe UI',sans-serif" font-weight="700" font-size="13" letter-spacing="3" text-anchor="middle">B2B DATA · DEMAND GENERATION</text>
  </g>

  <!-- Wordmark -->
  <g transform="translate(90, 260)">
    <text x="0" y="0" fill="url(#tc-word)" font-family="'Figtree','IBM Plex Sans','Segoe UI',sans-serif" font-weight="900" font-size="88" letter-spacing="-2">
      <tspan x="0" dy="0">Data Marketics</tspan>
    </text>
    <!-- brand accent underline -->
    <rect x="0" y="20" width="72" height="6" rx="3" fill="url(#tc-accent)"/>
  </g>

  <!-- Tagline -->
  <g transform="translate(90, 380)">
    <text x="0" y="0" fill="#ccfbf1" font-family="'Figtree','IBM Plex Sans','Segoe UI',sans-serif" font-weight="500" font-size="30" letter-spacing="-0.3">
      <tspan x="0" dy="0">Verified B2B data, demand generation,</tspan>
      <tspan x="0" dy="40">and lead generation that converts.</tspan>
    </text>
  </g>

  <!-- Footer: three social proof chips -->
  <g transform="translate(90, 528)" font-family="'Figtree','IBM Plex Sans','Segoe UI',sans-serif">
    <g>
      <rect x="0" y="0" width="180" height="46" rx="23" fill="#ffffff" fill-opacity="0.12" stroke="#5eead4" stroke-opacity="0.45" stroke-width="1"/>
      <text x="90" y="30" fill="#ecfdf5" font-weight="700" font-size="15" text-anchor="middle">10M+ Companies</text>
    </g>
    <g transform="translate(196, 0)">
      <rect x="0" y="0" width="200" height="46" rx="23" fill="#ffffff" fill-opacity="0.12" stroke="#5eead4" stroke-opacity="0.45" stroke-width="1"/>
      <text x="100" y="30" fill="#ecfdf5" font-weight="700" font-size="15" text-anchor="middle">60M+ Verified Contacts</text>
    </g>
    <g transform="translate(412, 0)">
      <rect x="0" y="0" width="176" height="46" rx="23" fill="#ffffff" fill-opacity="0.12" stroke="#5eead4" stroke-opacity="0.45" stroke-width="1"/>
      <text x="88" y="30" fill="#ecfdf5" font-weight="700" font-size="15" text-anchor="middle">95% Data Accuracy</text>
    </g>
  </g>

  <!-- Domain badge, top right -->
  <g transform="translate(1050, 90)">
    <rect x="-155" y="-22" width="155" height="34" rx="17" fill="#0b2727" fill-opacity="0.45" stroke="#5eead4" stroke-opacity="0.5" stroke-width="1"/>
    <text x="-77.5" y="1" fill="#ecfdf5" font-family="'Figtree','IBM Plex Sans','Segoe UI',sans-serif" font-weight="700" font-size="14" letter-spacing="0.5" text-anchor="middle">datamarketics.com</text>
  </g>
</svg>
