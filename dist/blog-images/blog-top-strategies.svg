<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Top 10 B2B Lead Generation Strategies">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="55%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="glow7" cx="80%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow8" cx="20%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots4" x="0" y="0" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#d1fae5" fill-opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg4)"/>
  <rect width="1200" height="630" fill="url(#dots4)"/>
  <rect width="1200" height="630" fill="url(#glow7)"/>
  <rect width="1200" height="630" fill="url(#glow8)"/>
  <!-- Growth chart bars -->
  <g transform="translate(600, 460)">
    <g stroke="none">
      <rect x="-260" y="-60" width="60" height="60" rx="6" fill="#5eead4" fill-opacity="0.28"/>
      <rect x="-180" y="-110" width="60" height="110" rx="6" fill="#5eead4" fill-opacity="0.45"/>
      <rect x="-100" y="-160" width="60" height="160" rx="6" fill="#5eead4" fill-opacity="0.60"/>
      <rect x="-20" y="-210" width="60" height="210" rx="6" fill="#2dd4bf" fill-opacity="0.75"/>
      <rect x="60" y="-260" width="60" height="260" rx="6" fill="#ccfbf1" fill-opacity="0.85"/>
      <rect x="140" y="-300" width="60" height="300" rx="6" fill="#ffffff" fill-opacity="0.95"/>
    </g>
    <!-- Trend line -->
    <path d="M -230 -30 L -150 -80 L -70 -130 L 10 -180 L 90 -230 L 170 -270" stroke="#fef3c7" stroke-width="4" fill="none" stroke-linecap="round"/>
    <g fill="#fcd34d">
      <circle cx="-230" cy="-30" r="6"/>
      <circle cx="-150" cy="-80" r="6"/>
      <circle cx="-70" cy="-130" r="6"/>
      <circle cx="10" cy="-180" r="6"/>
      <circle cx="90" cy="-230" r="6"/>
      <circle cx="170" cy="-270" r="6"/>
    </g>
    <!-- Baseline -->
    <line x1="-290" y1="10" x2="230" y2="10" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>
  <!-- Big "10" badge -->
  <g transform="translate(1010, 200)">
    <circle r="72" fill="#fcd34d" fill-opacity="0.15" stroke="#fcd34d" stroke-opacity="0.7" stroke-width="2.5"/>
    <text x="0" y="20" fill="#fef3c7" font-family="'Figtree','IBM Plex Sans',sans-serif" font-weight="900" font-size="72" text-anchor="middle">10</text>
  </g>
  <text x="500" y="130" fill="#ffffff" font-family="'Figtree','IBM Plex Sans',sans-serif" font-weight="800" font-size="42" text-anchor="middle" letter-spacing="-0.5">Top 10 Strategies</text>
  <text x="500" y="170" fill="#a7f3d0" font-family="'Figtree','IBM Plex Sans',sans-serif" font-weight="600" font-size="18" text-anchor="middle" opacity="0.85">Grow your sales pipeline in 2026</text>
</svg>
