<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice" role="img" aria-label="High-Quality B2B Leads">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e4a"/>
      <stop offset="55%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow3" cx="20%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#fcd34d" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#fcd34d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow4" cx="85%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots2" x="0" y="0" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ecfdf5" fill-opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg2)"/>
  <rect width="1200" height="630" fill="url(#dots2)"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>
  <rect width="1200" height="630" fill="url(#glow4)"/>
  <!-- Bullseye target -->
  <g transform="translate(600, 340)">
    <circle r="180" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    <circle r="140" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <circle r="100" fill="none" stroke="#5eead4" stroke-opacity="0.55" stroke-width="2.5"/>
    <circle r="60" fill="#5eead4" fill-opacity="0.25" stroke="#ccfbf1" stroke-width="2"/>
    <circle r="18" fill="#fcd34d"/>
    <!-- Arrow -->
    <g transform="translate(-260, -180) rotate(30)">
      <line x1="0" y1="0" x2="250" y2="150" stroke="#fef3c7" stroke-width="4" stroke-linecap="round"/>
      <polygon points="245,140 268,168 240,175" fill="#fcd34d"/>
    </g>
  </g>
  <text x="600" y="120" fill="#ffffff" font-family="'Figtree','IBM Plex Sans',sans-serif" font-weight="800" font-size="44" text-anchor="middle" letter-spacing="-0.5">High-Quality B2B Leads</text>
  <text x="600" y="565" fill="#ccfbf1" font-family="'Figtree','IBM Plex Sans',sans-serif" font-weight="500" font-size="20" text-anchor="middle" opacity="0.9">Target the right prospects. Convert with confidence.</text>
</svg>
