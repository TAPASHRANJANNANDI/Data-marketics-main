<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Inbound vs Outbound B2B Lead Generation">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="60%" stop-color="#0d7377"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="glow5" cx="10%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow6" cx="90%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots3" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#e0f2fe" fill-opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg3)"/>
  <rect width="1200" height="630" fill="url(#dots3)"/>
  <rect width="1200" height="630" fill="url(#glow5)"/>
  <rect width="1200" height="630" fill="url(#glow6)"/>
  <!-- Left: Inbound - arrows coming inward -->
  <g transform="translate(340, 340)">
    <circle r="120" fill="#67e8f9" fill-opacity="0.14" stroke="#67e8f9" stroke-opacity="0.55" stroke-width="2"/>
    <g stroke="#e0f2fe" stroke-width="3.5" stroke-linecap="round" fill="none">
      <path d="M -170 -60 L -30 -10" marker-end="url(#arrow-in)"/>
      <path d="M -170 60 L -30 10" marker-end="url(#arrow-in)"/>
      <path d="M -170 0 L -30 0" marker-end="url(#arrow-in)"/>
    </g>
    <text x="0" y="6" fill="#ffffff" font-family="'Figtree','IBM Plex Sans',sans-serif" font-weight="800" font-size="30" text-anchor="middle">Inbound</text>
    <text x="0" y="34" fill="#e0f2fe" font-family="'Figtree','IBM Plex Sans',sans-serif" font-weight="500" font-size="15" text-anchor="middle" opacity="0.9">They find you</text>
  </g>
  <!-- Right: Outbound - arrows going outward -->
  <g transform="translate(860, 340)">
    <circle r="120" fill="#5eead4" fill-opacity="0.14" stroke="#5eead4" stroke-opacity="0.55" stroke-width="2"/>
    <g stroke="#ccfbf1" stroke-width="3.5" stroke-linecap="round" fill="none">
      <path d="M 30 -10 L 170 -60" marker-end="url(#arrow-out)"/>
      <path d="M 30 10 L 170 60" marker-end="url(#arrow-out)"/>
      <path d="M 30 0 L 170 0" marker-end="url(#arrow-out)"/>
    </g>
    <text x="0" y="6" fill="#ffffff" font-family="'Figtree','IBM Plex Sans',sans-serif" font-weight="800" font-size="30" text-anchor="middle">Outbound</text>
    <text x="0" y="34" fill="#ccfbf1" font-family="'Figtree','IBM Plex Sans',sans-serif" font-weight="500" font-size="15" text-anchor="middle" opacity="0.9">You reach out</text>
  </g>
  <defs>
    <marker id="arrow-in" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0f2fe"/>
    </marker>
    <marker id="arrow-out" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ccfbf1"/>
    </marker>
  </defs>
  <text x="600" y="120" fill="#ffffff" font-family="'Figtree','IBM Plex Sans',sans-serif" font-weight="800" font-size="42" text-anchor="middle" letter-spacing="-0.5">Inbound vs Outbound</text>
  <text x="600" y="555" fill="#e0f2fe" font-family="'Figtree','IBM Plex Sans',sans-serif" font-weight="500" font-size="20" text-anchor="middle" opacity="0.9">Which strategy fuels your pipeline?</text>
</svg>
