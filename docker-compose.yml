services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datamarketics-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    networks:
      - datamarketics
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/chat", "--post-data", "{}", "--header=Content-Type:application/json", "||", "exit", "0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: datamarketics-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - datamarketics

networks:
  datamarketics:
    driver: bridge
