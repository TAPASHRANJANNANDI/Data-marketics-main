# Whether the original request reached the edge over plain HTTP. TLS is
# terminated upstream, so $scheme is always "http" in here and cannot be
# used for this. When the proxy sends no X-Forwarded-Proto the TLS state
# is unknown, and redirecting on a guess would risk a redirect loop — so
# the default is "do not redirect" and the edge must either send the
# header or perform the HTTP->HTTPS redirect itself.
map $http_x_forwarded_proto $dm_insecure {
    default  0;
    http     1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # www.datamarketics.com used to serve an older site whose robots.txt
    # blocked crawlers, so every link to the www host was wasted. Send it
    # to the canonical host instead. Checked before every location below,
    # so a www request for a legacy .html path takes a single hop to its
    # final https://datamarketics.com/<page> URL.
    if ($host ~* ^www\.(?<dm_canonical_host>.+)$) {
        return 301 https://$dm_canonical_host$request_uri;
    }

    # http://datamarketics.com/... -> https://datamarketics.com/...
    if ($dm_insecure) {
        return 301 https://$host$request_uri;
    }

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Google indexed several legacy / duplicate index paths that all served
    # the same SPA shell. 301-redirect them to the canonical home so Search
    # Console stops flagging "Duplicate without user-selected canonical".
    # Query strings preserved. Note: we can safely redirect /index.html here
    # because the SPA fallback below uses a named @spa location (whose
    # try_files serves /index.html directly without re-matching these
    # location blocks), so no redirect loop.
    location = /index {
        return 301 https://$host/$is_args$args;
    }
    location = /index.html {
        return 301 https://$host/$is_args$args;
    }
    location = /index.php {
        return 301 https://$host/$is_args$args;
    }
    location ~ ^/index[0-9]+\.html$ {
        return 301 https://$host/$is_args$args;
    }
    location = /sitemap.html {
        return 301 https://$host/sitemap$is_args$args;
    }

    # Legacy .html paths from an older site version. Google Search Console
    # flagged these as "not found" because the SPA served the shell but no
    # React route matched, resulting in blank content (soft-404). Explicit
    # 301 to each canonical route so link equity is consolidated and the
    # user lands on real content.
    location = /about {
        return 301 https://$host/about-us$is_args$args;
    }
    location = /about.html {
        return 301 https://$host/about-us$is_args$args;
    }
    location = /about-us.html {
        return 301 https://$host/about-us$is_args$args;
    }
    location = /contact.html {
        return 301 https://$host/contact$is_args$args;
    }
    location = /services.html {
        return 301 https://$host/services$is_args$args;
    }
    location = /our-services.html {
        return 301 https://$host/services$is_args$args;
    }
    location = /features.html {
        return 301 https://$host/features$is_args$args;
    }
    location = /demand-generation.html {
        return 301 https://$host/demand-generation$is_args$args;
    }
    location = /b2b-lead-generation.html {
        return 301 https://$host/b2b-lead-generation$is_args$args;
    }
    location = /data-enrichment.html {
        return 301 https://$host/data-enrichment$is_args$args;
    }
    # Legacy service name — closest match on the current site is data enrichment.
    location = /data-segmentation-services {
        return 301 https://$host/data-enrichment$is_args$args;
    }
    location = /data-segmentation-services.html {
        return 301 https://$host/data-enrichment$is_args$args;
    }
    location = /appointment-setting.html {
        return 301 https://$host/appointment-setting$is_args$args;
    }
    location = /intent-data.html {
        return 301 https://$host/intent-data$is_args$args;
    }
    location = /exhibitors-data.html {
        return 301 https://$host/exhibitors-data$is_args$args;
    }
    location = /privacy-policy.html {
        return 301 https://$host/privacy-policy$is_args$args;
    }

    # Every route is pre-rendered to its own <route>/index.html by
    # scripts/prerender.mjs, so there is no SPA fallback any more: a path
    # that matches no generated page is genuinely not a page, and gets a
    # real 404. Previously such URLs served the homepage shell with a 200,
    # which Search Console reports as a soft 404 and which wastes crawl
    # budget on infinitely many junk URLs.
    #
    # The $uri/ directory check is intentionally skipped: with it, a bare /
    # would resolve to the / directory and the server-level
    # `index index.html;` directive would internally rewrite to /index.html,
    # which the location above would 301 back to / — an infinite loop.
    location / {
        try_files $uri $uri/index.html @notfound;
    }

    # Named location, so serving /404.html here is not re-matched by the
    # external location blocks above.
    location @notfound {
        return 404;
    }

    error_page 404 /404.html;

    # internal: /404.html is reachable only through error_page, never as a
    # URL of its own, so the 404 page itself cannot be indexed.
    location = /404.html {
        internal;
    }
}
