server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Google indexed several legacy / duplicate index paths that all served
    # the same SPA shell. 301-redirect them to the canonical home so Search
    # Console stops flagging "Duplicate without user-selected canonical".
    # Query strings preserved. Note: we can safely redirect /index.html here
    # because the SPA fallback below uses a named @spa location (whose
    # try_files serves /index.html directly without re-matching these
    # location blocks), so no redirect loop.
    location = /index {
        return 301 https://$host/$is_args$args;
    }
    location = /index.html {
        return 301 https://$host/$is_args$args;
    }
    location = /index.php {
        return 301 https://$host/$is_args$args;
    }
    location ~ ^/index[0-9]+\.html$ {
        return 301 https://$host/$is_args$args;
    }
    location = /sitemap.html {
        return 301 https://$host/sitemap$is_args$args;
    }

    # Legacy .html paths from an older site version. Google Search Console
    # flagged these as "not found" because the SPA served the shell but no
    # React route matched, resulting in blank content (soft-404). Explicit
    # 301 to each canonical route so link equity is consolidated and the
    # user lands on real content.
    location = /about.html {
        return 301 https://$host/about-us$is_args$args;
    }
    location = /about-us.html {
        return 301 https://$host/about-us$is_args$args;
    }
    location = /contact.html {
        return 301 https://$host/contact$is_args$args;
    }
    location = /services.html {
        return 301 https://$host/services$is_args$args;
    }
    location = /our-services.html {
        return 301 https://$host/services$is_args$args;
    }
    location = /features.html {
        return 301 https://$host/features$is_args$args;
    }
    location = /demand-generation.html {
        return 301 https://$host/demand-generation$is_args$args;
    }
    location = /b2b-lead-generation.html {
        return 301 https://$host/b2b-lead-generation$is_args$args;
    }
    location = /data-enrichment.html {
        return 301 https://$host/data-enrichment$is_args$args;
    }
    # Legacy service name — closest match on the current site is data enrichment.
    location = /data-segmentation-services {
        return 301 https://$host/data-enrichment$is_args$args;
    }
    location = /data-segmentation-services.html {
        return 301 https://$host/data-enrichment$is_args$args;
    }
    location = /appointment-setting.html {
        return 301 https://$host/appointment-setting$is_args$args;
    }
    location = /intent-data.html {
        return 301 https://$host/intent-data$is_args$args;
    }
    location = /exhibitors-data.html {
        return 301 https://$host/exhibitors-data$is_args$args;
    }
    location = /privacy-policy.html {
        return 301 https://$host/privacy-policy$is_args$args;
    }

    # Retired page. The old site had a download page; the current site has no
    # equivalent, so there is nothing honest to 301 to — redirecting it to the
    # home page would just be a soft 404 in Search Console's eyes. 410 tells
    # Google the URL is intentionally gone and gets it deindexed fastest.
    # Without this block the SPA fallback below answers 200 with the app shell,
    # which is why the URL stayed indexed.
    location = /download.html {
        return 410;
    }

    # Note: we intentionally skip the $uri/ directory check here. With it,
    # a bare / would resolve to the / directory and the server-level
    # `index index.html;` directive would internally rewrite to /index.html
    # — which the location above would then 301 back to /, an infinite loop.
    # Dropping $uri/ makes / fall through to @spa cleanly.
    location / {
        try_files $uri $uri/index.html @spa;
    }

    # Named location — not re-matched by external location blocks above,
    # so serving /index.html here does NOT trigger the /index.html 301.
    location @spa {
        try_files /index.html =404;
    }
}
