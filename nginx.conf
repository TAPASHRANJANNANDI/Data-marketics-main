server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Google indexed the old /index path — 301-redirect to canonical home.
    # Sends https://<host>/ so Cloudflare doesn't have to do a second
    # http→https hop. Query string (?utm_source=...) is preserved.
    # NOTE: we do NOT redirect /index.html because try_files below internally
    # rewrites to /index.html for every SPA route; catching it here would 301
    # every route on the site to /.
    location = /index {
        return 301 https://$host/$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
